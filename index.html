<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Boyfriend's Day, Modakk 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6e1f2b; --maroon-d:#4a1019; --cream:#fbf1e2; --rose:#d98b8b; --gold:#c9954a; --ink:#3a1f1f;
  --hand:'Playfair Display',Georgia,'Times New Roman',serif;
  --serif:'Montserrat','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--serif);color:var(--ink);
  background:#e9c9b4 url('bg.jpg') center/cover fixed no-repeat;
  background-image:url('bg.jpg'),linear-gradient(160deg,#f3d3bd,#e3a9a0 55%,#c98a8f);
  display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0);
  overflow-x:hidden;
}
#card{
  width:100%;max-width:460px;max-height:94vh;overflow-y:auto;
  background:rgba(255,248,238,.62);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7);border-radius:22px;
  box-shadow:0 18px 50px rgba(74,16,25,.28);
  padding:18px 18px 22px;text-align:center;
}
.page{display:none}
.page.on{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.on{animation:none}}

h1,h2{font-family:var(--hand);font-weight:700;color:var(--maroon);margin:.2em 0 .3em;line-height:1.05}
h1{font-size:1.9rem} h2{font-size:1.6rem}
p{line-height:1.55;margin:.5em 0}
.tag{font-family:var(--hand);font-size:1.05rem;color:var(--maroon);opacity:.9}
img.pic{width:100%;border-radius:12px;display:block;margin:6px 0 14px;box-shadow:0 6px 18px rgba(74,16,25,.25)}
img.pic.missing{display:none}
.ph{display:none;border:2px dashed var(--rose);border-radius:12px;padding:34px 12px;margin:6px 0 14px;font-family:var(--serif);font-size:1rem;color:var(--maroon)}
img.pic.missing + .ph{display:block}

button,.btn{
  font-family:var(--serif);font-size:1.05rem;font-weight:700;
  background:var(--maroon);color:#fff5e8;border:0;border-radius:999px;
  padding:12px 26px;margin-top:10px;cursor:pointer;
  box-shadow:0 5px 0 var(--maroon-d);transition:transform .08s,box-shadow .08s;
  display:inline-block;text-decoration:none;
}
button:active,.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--maroon-d)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.ghost{background:transparent;color:var(--maroon);box-shadow:none;border:2px solid var(--maroon)}

.opt{
  display:block;width:100%;text-align:left;font-family:var(--serif);font-size:.95rem;font-weight:500;
  background:#fffaf2;color:var(--ink);border:2px solid var(--rose);border-radius:14px;
  padding:13px 14px;margin:10px 0;box-shadow:none;line-height:1.35;
}
.opt:active{transform:scale(.99);box-shadow:none}
.opt.good{background:#e6f2d9;border-color:#7aa65a}
.opt.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

input[type=text],textarea{
  width:100%;font-family:var(--serif);font-size:1rem;color:var(--ink);
  background:#fffaf2;border:2px solid var(--rose);border-radius:12px;padding:12px;margin:6px 0 10px;
}
textarea{min-height:130px;resize:vertical}
label{display:block;text-align:left;font-weight:600;margin-top:10px}

.toast{min-height:1.6em;font-family:var(--hand);font-size:1.05rem;color:var(--maroon);margin-top:8px}

img.pic.cover{width:auto;max-width:100%;max-height:66vh;margin:6px auto 10px}
.tickets{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;margin:6px 0 12px}
.tickets img{width:100%;transform:rotate(var(--r));filter:drop-shadow(0 4px 5px rgba(74,16,25,.28))}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.mc{position:relative;aspect-ratio:3/4;padding:0;margin:0;border-radius:12px;box-shadow:0 3px 0 var(--maroon-d);background:var(--maroon);font-size:1.9rem;display:flex;align-items:center;justify-content:center}
.mc .back{display:none}.mc .front{opacity:.85;font-size:1.4rem}
.mc.up,.mc.done{background:#fffaf2;box-shadow:0 3px 0 var(--rose);border:2px solid var(--rose)}
.mc.up .back,.mc.done .back{display:inline}.mc.up .front,.mc.done .front{display:none}
.mc.done{background:#e6f2d9;border-color:#7aa65a}
.iloveyou{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-weight:800;text-transform:uppercase;font-size:2.6rem;line-height:1.1;letter-spacing:.02em;color:var(--maroon);margin:40px 0;padding:0 4px;word-break:keep-all}
/* wish paper */
.wish{position:relative;width:100%;aspect-ratio:1/1;background:url('wish_paper.png') center/contain no-repeat;filter:drop-shadow(0 6px 10px rgba(74,16,25,.25))}
.wishbox{position:absolute;left:11%;right:11%;top:39%;bottom:20%;display:flex;flex-direction:column}
.wishbox .tag{font-size:1rem;line-height:1}
.wishbox textarea{flex:1;min-height:0;margin:4px 0 0;padding:8px 10px;font-size:.95rem;background:rgba(255,250,240,.55);border:1.5px solid rgba(110,31,43,.35)}
.wishtoast{min-height:1.4em;font-size:.95rem;margin:0}


/* heart game */
#arena{position:relative;height:360px;overflow:hidden;border-radius:16px;margin-top:10px;
  background:linear-gradient(#fff3e6aa,#f3c9c4aa);border:2px dashed var(--rose);touch-action:manipulation}
.heart{position:absolute;top:0;width:74px;height:68px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:600;font-size:1.35rem;color:#fff;cursor:pointer;user-select:none;
  background:none;border:0;padding:0;box-shadow:none;margin:0}
.heart svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 3px rgba(74,16,25,.35))}
.heart span{position:relative;top:-3px}
.heart.pop{animation:pop .3s forwards}
@keyframes pop{to{transform:scale(1.8);opacity:0}}

.heart.word{width:104px;height:96px}.heart.word span{font-size:.8rem;letter-spacing:.02em;top:-6px}
/* scramble */
.letters{font-family:var(--hand);font-weight:800;font-size:2rem;letter-spacing:.3em;margin-right:-.3em;color:var(--maroon);margin:12px 0 6px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--rose);opacity:.45}
.dots i.d{opacity:1;background:var(--maroon)}

#thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
#thumbs div{aspect-ratio:1;border-radius:8px;background:#fffaf2 center/cover;border:1px solid var(--rose);display:flex;align-items:center;justify-content:center;font-size:1.4rem}

ul.wishes{text-align:left;margin:10px 0;padding-left:1.2em;line-height:1.5}
ul.wishes li{margin:7px 0}
.big{font-size:3rem;margin:4px 0}
.sig{font-family:var(--hand);font-size:1.3rem;color:var(--maroon);margin-top:14px}
</style>
</head>
<body>
<main id="card" aria-live="polite">

  <!-- 1 cover -->
  <section class="page" id="p-cover">
    <img class="pic cover" src="cover.jpg" alt="Scrapbook cover: Happy Boyfriend's Day, Modakk">
    <div class="ph">cover.jpg goes here</div>
    <button data-go="letter">Open Surprise 💌</button>
  </section>

  <!-- 2 letter -->
  <section class="page" id="p-letter">
    <h2>A Not So Love Letter</h2>
    <img class="pic" src="letter.jpg" alt="A handwritten letter">
    <div class="ph">letter.jpg goes here</div>
    <button data-go="rules">Continue ➡</button>
  </section>

  <!-- 3 rules -->
  <section class="page" id="p-rules">
    <h2>Rules of the game</h2>
    <div class="tickets">
      <img src="ticket1.png" alt="Free kisses coupon" style="--r:-3deg">
      <img src="ticket2.png" alt="Free cuddle ticket" style="--r:2.5deg">
      <img src="ticket3.png" alt="Free hugs ticket" style="--r:2deg">
      <img src="ticket4.png" alt="Free sleep call ticket" style="--r:-2.5deg">
    </div>
    <p>There are <b>7 mini-games</b> about us.</p>
    <p>Win a game and you unlock a wish coupon. On each one, you can ask for anything you want.</p>
    <button id="start">Start Game 1 🎮</button>
  </section>

  <!-- dynamic game / wish pages -->
  <section class="page" id="p-game"></section>
  <section class="page" id="p-wish"></section>

  <!-- summary -->
  <section class="page" id="p-summary">
    <div class="big">🏆</div>
    <h2>Congratulations!</h2>
    <p>You unlocked <b>7 out of 7</b> wishes!</p>
    <ul class="wishes" id="wishList"></ul>
    <button id="toFinal">Final Message ❤️</button>
  </section>

  <!-- final -->
  <section class="page" id="p-final">
    <h1 class="iloveyou">I LOVE YOU MODAKK</h1>
  </section>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const card = $('#card');
  const wishes = [];

  /* ---- email delivery (Web3Forms) ----
     Get a free access key at web3forms.com (enter your email, they send you the key) and paste it below. */
  const WEB3FORMS_KEY = 'b1e804e6-2a77-4f23-acb5-b5f3b012b532';
  async function sendOnce(subject, message){
    if(!WEB3FORMS_KEY || WEB3FORMS_KEY.startsWith('PASTE')) return false;
    try{
      const r = await fetch('https://api.web3forms.com/submit', {
        method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
        body: JSON.stringify({ access_key: WEB3FORMS_KEY, subject, from_name:'Modakk\'s wishes', message: message + '\n\n(sent ' + new Date().toLocaleString() + ')' })
      });
      const j = await r.json();
      return !!j.success;
    }catch(e){ return false; }
  }
  /* send one email at a time, retry if one fails, so none get dropped */
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let mailQueue = Promise.resolve();
  function sendMail(subject, message){
    mailQueue = mailQueue.then(async () => {
      for(let a = 0; a < 4; a++){
        if(await sendOnce(subject, message)){ await sleep(1500); return true; }
        await sleep(2500 * (a + 1));
      }
      return false;
    });
    return mailQueue;
  }

  /* hide broken images, show placeholder instead */
  document.querySelectorAll('img.pic').forEach(img => {
    img.addEventListener('error', () => img.classList.add('missing'));
  });

  function show(id){
    document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
    const el = $('#' + id);
    el.classList.add('on');
    card.scrollTop = 0;
  }
  const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };
  const toast = (msg) => { const t = $('#p-game .toast'); if (t) t.textContent = msg; };

  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => show('p-' + b.dataset.go));

  /* ---------- game definitions ---------- */
  const games = [
    { title:'Game 1: The Secret Habit 🤫', run:quiz, q:'What is the one thing/habit of yours that I secretly love the most?',
      opts:['How cute you look when you get emotional/expressive','How you always check on me continuously','The way you randomly call me sweet nicknames'], correct:null,
      win:'Aww, all of them are right. 🥹' },
    { title:'Game 2: My Favorite Memory 💖', run:quiz, q:'Out of all these special milestones, which one is my absolute favorite memory of us?',
      opts:['The day you confessed your feelings to me','The days you send me your pictures and voice notes','The day you told me you want to spend the rest of your life living with me forever'], correct:0,
      win:'Yesss, you remember! 💖' },
    { title:'Game 3: Catch the Heart! 🎯', run:hearts },
    { title:'Game 4: Word Unscramble 🧩', run:scramble },
    { title:'Game 5: Comfort & Habits Quiz 🍦', run:comfort },
    { title:'Game 6: Memory Match 🃏', run:match },
    { title:'Game 7: Our Songs Finale 🎶', run:quiz, q:'Which two iconic songs are deeply attached to us and our relationship?',
      opts:['Paper Rings & Lovestory','Kalank Title Track & Mera Mann Kehne Laga','Affection & Perfect'], correct:1,
      win:'Our songs. 🎶' }
  ];
  let idx = 0;

  function startGame(i){
    idx = i;
    const g = games[i];
    const page = $('#p-game');
    page.innerHTML = `<div class="tag">Round ${i+1} of 7</div><h2>${g.title}</h2><div id="body"></div><div class="toast" role="status"></div>`;
    show('p-game');
    g.run(g, $('#body'));
  }

  function passed(msg){
    toast(msg || 'Unlocked! ✨');
    setTimeout(() => showWish(idx), 1000);
  }

  function showWish(i){
    const page = $('#p-wish');
    page.innerHTML = `
      <div class="tag">Wish Paper #${i+1} unlocked 🌹</div>
      <div class="wish">
        <div class="wishbox">
          <textarea id="wishText" placeholder="Write your wish here. Ask for anything you want…" aria-label="Your wish"></textarea>
        </div>
      </div>
      <div class="toast wishtoast" id="wishToast" role="status"></div>
      <button id="submitWish">Submit Wish ✨</button>`;
    show('p-wish');
    $('#submitWish').onclick = () => {
      const v = $('#wishText').value.trim();
      if(!v){ $('#wishToast').textContent = 'Write something first, no skipping 😜'; return; }
      wishes.push(v);
      if(i < games.length - 1) startGame(i + 1); else showSummary();
    };
  }

  function showSummary(){
    const ul = $('#wishList'); ul.innerHTML = '';
    wishes.forEach(w => { const li = document.createElement('li'); li.textContent = w; ul.appendChild(li); });
    show('p-summary');
    sendMail('💌 All 7 wishes from Modakk', wishes.map((w,k) => (k+1) + '. ' + w).join('\n\n'));
  }

  $('#start').onclick = () => startGame(0);
  $('#toFinal').onclick = () => {
    show('p-final');
  };

  /* ---------- multiple choice ---------- */
  function quiz(g, body){
    body.innerHTML = `<p>${g.q}</p>`;
    let done = false;
    g.opts.forEach((o, n) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = o;
      b.onclick = () => {
        if(done) return;
        if(g.correct === null || n === g.correct){
          done = true; b.classList.add('good'); passed(g.win);
        } else {
          b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
          toast("That's sweet, but try again! 😜");
        }
      };
      body.appendChild(b);
    });
  }

  /* ---------- Catch the Heart ---------- */
  function hearts(g, body){
    const rounds = [
      { prompt:'Tap the heart with the date you confessed/proposed to me!', ans:8, max:31 },
      { prompt:'Tap the heart with the nickname you call me that I love!', ans:'baccha', words:['baccha','love','bhondhu'] },
      { prompt:'Tap the heart with the total months we\u2019ve been together!', ans:7, max:12 }
    ];
    let r = 0, raf = null, alive = false;
    body.innerHTML = `<p id="hp"></p><div id="arena" aria-label="Falling hearts"></div>`;
    const arena = $('#arena');
    const heartSvg = '<svg viewBox="0 0 32 29" aria-hidden="true"><path d="M16 28C6 20 1 14.5 1 8.8 1 4.5 4.3 1.5 8.3 1.5c3 0 5.6 1.7 7.7 4.6C18.100 3.200 20.700 1.500 23.700 1.500 27.700 1.500 31 4.500 31 8.800 31 14.500 26 20 16 28z" fill="#c8434f"/></svg>';

    function setup(){
      const R = rounds[r];
      $('#hp').innerHTML = `<b>Round ${r+1}/3</b><br>${R.prompt}`;
      arena.innerHTML = '';
      let list;
      if(R.words){ list = [...R.words].sort(() => Math.random() - .5); }
      else {
        const nums = new Set([R.ans]);
        while(nums.size < 3) nums.add(1 + Math.floor(Math.random() * R.max));
        list = [...nums].sort(() => Math.random() - .5);
      }
      const hw = R.words ? 104 : 74;
      const w = arena.clientWidth, H = arena.clientHeight;
      const slot = (w - hw) / 2;
      const items = list.map((n, k) => {
        const h = document.createElement('button');
        h.className = 'heart' + (R.words ? ' word' : ''); h.setAttribute('aria-label', 'Heart ' + n);
        h.innerHTML = heartSvg + '<span>' + n + '</span>';
        const x = Math.max(0, Math.min(w - hw, slot * k + (Math.random() - .5) * 24));
        const delay = k * 900 + Math.random() * 500;
        const dur = 6200 + Math.random() * 1200;
        h.style.left = x + 'px';
        h.style.transform = 'translateY(-80px)';
        arena.appendChild(h);
        const it = { h, n, delay, dur, done:false };
        h.addEventListener('pointerdown', e => { e.preventDefault(); tap(it); });
        return it;
      });
      const t0 = performance.now(); alive = true;
      const step = (now) => {
        if(!alive) return;
        let correctGone = false;
        items.forEach(it => {
          if(it.done) return;
          const p = (now - t0 - it.delay) / it.dur;
          const y = -80 + Math.max(0, p) * (H + 80);
          it.h.style.transform = `translateY(${y}px)`;
          if(p >= 1){ it.done = true; it.h.style.display = 'none'; if(it.n === R.ans) correctGone = true; }
        });
        if(correctGone){ alive = false; toast('Too slow! Here they come again 😜'); setTimeout(setup, 900); return; }
        raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    }

    function tap(it){
      if(!alive || it.done) return;
      const R = rounds[r];
      if(it.n === R.ans){
        alive = false; cancelAnimationFrame(raf);
        it.h.classList.add('pop');
        r++;
        if(r < rounds.length){ toast('Yes! Next one 💗'); setTimeout(() => { toast(''); setup(); }, 800); }
        else { passed('You caught them all! 💖'); }
      } else {
        it.done = true; it.h.style.display = 'none';
        toast('Nope, not that one 😜');
      }
    }
    setup();
  }

  /* ---------- Word unscramble ---------- */
  function scramble(g, body){
    const words = [
      { ans:'MODAK',   scr:'DKAOM' },
      { ans:'BACCHA',  scr:'HCABAC' },
      { ans:'BHONDHU', scr:'DNHUHOB' }
    ];
    let n = 0;
    function render(){
      const w = words[n];
      body.innerHTML = `
        <div class="dots">${words.map((_, k) => `<i class="${k < n ? 'd' : ''}"></i>`).join('')}</div>
        <p>Unscramble the word:</p>
        <div class="letters" aria-label="${w.scr.split('').join(' ')}">${w.scr}</div>
        <input type="text" id="ans" autocomplete="off" autocapitalize="characters" placeholder="Type it here" aria-label="Your answer">
        <button id="chk">Check</button>`;
      const inp = $('#ans');
      const check = () => {
        if(inp.value.trim().toUpperCase() === w.ans){
          n++;
          if(n < words.length){ toast('Correct! 💗'); setTimeout(() => { toast(''); render(); }, 700); }
          else passed('All three, perfect! 🧩');
        } else toast('Not quite, try again 😜');
      };
      $('#chk').onclick = check;
      inp.onkeydown = e => { if(e.key === 'Enter') check(); };
    }
    render();
  }

  /* ---------- Comfort & habits ---------- */
  function comfort(g, body){
    body.innerHTML = `
      <label for="movie">What is my favorite movie of all time?</label>
      <input type="text" id="movie" autocomplete="off">
      <label for="sweet">What is my comfort food?</label>
      <input type="text" id="sweet" autocomplete="off">
      <button id="chk">Submit</button>`;
    $('#chk').onclick = () => {
      const m = $('#movie').value.toLowerCase().replace(/[^a-z0-9]/g, '');
      const f = $('#sweet').value.toLowerCase().replace(/[^a-z]/g, '');
      const hasIce = f.includes('ice'), hasCake = f.includes('cake');
      if(m !== '27dresses') toast("Hmm, that's not her movie. Try again 😜");
      else if(!f) toast('Fill in my comfort food too 🍦');
      else if(hasIce && hasCake) passed('You really know me 🍦');
      else if(hasIce || hasCake) toast('So close, there is one more! 😜');
      else toast("Nope, that's not my comfort food 😜");
    };
  }

  /* ---------- Memory match ---------- */
  function match(g, body){
    const faces = ['🍦','🎬','🌙','🎶','💌','🧸'];
    const deck = [...faces, ...faces].sort(() => Math.random() - .5);
    body.innerHTML = `<p>Find all 6 matching pairs of our little things.</p><div id="grid"></div><div class="dots" id="pairs"></div>`;
    const grid = $('#grid');
    let first = null, lock = false, found = 0;
    const upd = () => { $('#pairs').innerHTML = faces.map((_, k) => `<i class="${k < found ? 'd' : ''}"></i>`).join(''); };
    upd();
    deck.forEach(f => {
      const c = document.createElement('button');
      c.className = 'mc'; c.setAttribute('aria-label', 'Hidden card');
      c.innerHTML = '<span class="front">💗</span><span class="back">' + f + '</span>';
      c.onclick = () => {
        if(lock || c.classList.contains('up') || c.classList.contains('done')) return;
        c.classList.add('up');
        if(!first){ first = c; return; }
        if(first.querySelector('.back').textContent === f){
          first.classList.add('done'); c.classList.add('done'); first = null; found++; upd();
          if(found === faces.length) passed('All pairs found! 🃏');
        } else {
          lock = true; const p = first; first = null;
          setTimeout(() => { p.classList.remove('up'); c.classList.remove('up'); lock = false; }, 800);
        }
      };
      grid.appendChild(c);
    });
  }

  show('p-cover');
})();
</script>
</body>
</html>
